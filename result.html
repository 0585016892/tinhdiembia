<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Billiard Hưng - Final Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css" rel="stylesheet">
  <link rel="manifest" href="./manifest.json">

  <meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="apple-mobile-web-app-title" content="Billiard Hưng">

<link rel="apple-touch-icon" href="assets/icons/icon-192.png">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

    :root {
      --primary: #00f2ff;
      --secondary: #7000ff;
      --success: #4ade80;
      --danger: #fb7185;
      --deep-bg: #030712;
    }

    body {
      background-color: var(--deep-bg);
      background-image: 
        radial-gradient(circle at 50% -20%, rgba(0, 242, 255, 0.15) 0%, transparent 50%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding-bottom: 30px;
      padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    }

    .result-header {
      padding: 40px 0 25px;
      text-align: center;
    }

    .cyber-badge {
      display: inline-block;
      padding: 5px 15px;
      background: rgba(0, 242, 255, 0.1);
      border: 1px solid var(--primary);
      color: var(--primary);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-radius: 5px;
      margin-bottom: 10px;
    }

    /* Thẻ kết quả kiểu Hologram */
    .result-item {
      background: rgba(17, 24, 39, 0.6);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 15px 20px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .result-item.winner { border-right: 4px solid var(--success); }
    .result-item.loser { border-right: 4px solid var(--danger); }

    .player-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-hex {
      width: 45px;
      height: 45px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.2);
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-family: 'Orbitron', sans-serif;
    }

    .point-tag {
      font-size: 0.65rem;
      font-family: 'Orbitron', sans-serif;
      color: #94a3b8;
    }

    .money-amount {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      text-align: right;
    }

    /* Total Summary Box */
    .total-summary {
      background: linear-gradient(135deg, rgba(112, 0, 255, 0.2), rgba(0, 242, 255, 0.1));
      border: 1px solid var(--primary);
      border-radius: 24px;
      padding: 25px;
      text-align: center;
      margin: 30px 0;
      position: relative;
      box-shadow: 0 0 20px rgba(0, 242, 255, 0.1);
    }

    .total-summary::after {
      content: 'CONFIRMED';
      position: absolute;
      top: 10px; right: 15px;
      font-size: 0.5rem;
      font-family: 'Orbitron';
      color: var(--primary);
      opacity: 0.5;
    }

    .total-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--success);
      text-shadow: 0 0 15px rgba(74, 222, 128, 0.3);
    }

    /* Bottom Buttons */
    .btn-cyber-outline {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: #94a3b8;
      border-radius: 15px;
      padding: 12px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      transition: all 0.3s;
    }

    .btn-cyber-danger {
      background: rgba(251, 113, 133, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      border-radius: 15px;
      padding: 12px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
    }

    .btn-cyber-danger:active {
      background: var(--danger);
      color: #000;
    }

    .lock-notice {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #475569;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="container px-4 animate__animated animate__fadeIn">
  
  <div class="result-header">
    <div class="cyber-badge">Final Session Report</div>
    <h2 class="fw-bold mb-0" style="font-family: 'Orbitron';">TỔNG KẾT</h2>
    <p id="time" class="small mt-2" style="color: var(--primary); opacity: 0.7;"></p>
  </div>

  <div id="resultList">
    <div class="result-item winner">
      <div class="player-meta">
        <div class="avatar-hex" style="color: var(--success); border-color: var(--success);">H</div>
        <div>
          <div class="fw-bold">Hưng</div>
          <span class="point-tag">POINTS: +15</span>
        </div>
      </div>
      <div class="money-amount text-success">+450,000</div>
    </div>
  </div>

  <div class="total-summary">
    <div class="small opacity-50 mb-1" style="font-size: 0.7rem; letter-spacing: 2px;">TOTAL_VALUE</div>
    <div class="total-value" id="totalMoney">0đ</div>
  </div>

  <div class="lock-notice text-center mb-4">
    <i class="bi bi-cpu-fill"></i> DATA_LOCKED // STORAGE_SAVED
  </div>

  <div class="row g-2">
    <div class="col-6">
      <button class="btn btn-cyber-outline w-100" onclick="goBack()">
        <i class="bi bi-chevron-left"></i> BACK
      </button>
    </div>
    <div class="col-6">
      <button class="btn btn-cyber-danger w-100" onclick="resetAll()">
        <i class="bi bi-power"></i> NEW_SESSION
      </button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/result.js"></script>

</body>
</html>
